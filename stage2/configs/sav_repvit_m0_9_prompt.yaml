# Stage 2 — Temporal Memory Distillation: RepViT-M0.9 student vs SAM3 ViT-H teacher
# Milestone 1: mask-prompted (prompt-conditioned) tracking variant.
# IMG_SIZE=1008 (SAM3 RoPE constraint), MAX_FRAMES=8 (ONNX static shape)

DATA:
  DATASET: sav
  SAV_TAR_DIR: /mnt/exoshdd/datasets/SA-V/
  SAV_INDEX_CACHE: data/sav_index.pkl
  PREDECODE_DIR: /home/saif/sav_predecoded   # NVMe JPEG bundles: skip HDD seek + video decode (~2x faster dataloader)
  BATCH_SIZE: 2
  NUM_WORKERS: 24          # 16->24: more parallel decoders to absorb slow-clip bursts (GPU was
                           # data-starved/fluctuating once the teacher cache made compute cheap).
                           # prefetch kept at 2 — 24x2=48 in-flight units ~82GB RSS, safe on the
                           # 123GB no-swap box (24x4 would OOM). 32 logical / 16 physical cores.
  PREFETCH_FACTOR: 2       # was 4. Halves in-flight batch queue (~14 GB → ~7 GB).
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  IMG_SIZE: 1008
  MAX_FRAMES: 8

MODEL:
  TYPE: efficient_sam3_temporal
  NAME: efficient_sam3_stage2
  BACKBONE: repvit_m0_9
  STUDENT_CKPT: checkpoints/efficient_sam3_repvit_s.pt
  TEACHER_CKPT: /mnt/exoshdd/checkpoints/sam3/sam3.pt
  PERCEIVER_DIM: 256
  PERCEIVER_DEPTH: 4
  PERCEIVER_LATENTS: 64
  PERCEIVER_HEADS: 8
  # ---- Milestone 1: mask-prompted (prompt-conditioned) tracking ----
  PROMPT_CONDITIONING: true

DISTILL:
  ENABLED: true
  MSE_WEIGHT: 1.0
  COSINE_WEIGHT: 1.0
  NORM_WEIGHT: 2.0         # was 0.25 — ep50_run2 collapsed mlp_out to 50x init scale; 8x stronger.
  FEATURE_DIM: 256
  # ---- Milestone 1 ----
  MASK_LOSS_WEIGHT: 1.0      # supervise decoded masks vs GT (BCE+Dice)
  MASK_BCE_WEIGHT: 1.0
  MASK_DICE_WEIGHT: 1.0
  TEACHER_FRAME0_ONLY: true  # teacher conditions on GT only at frame 0
  TEACHER_CACHE_DIR: /home/saif/teacher_cache

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 1.0e-4
  WARMUP_LR: 1.0e-7
  MIN_LR: 1.0e-6
  WEIGHT_DECAY: 0.1        # was 0.05 — extra decay pressure on mlp_out/out_attn weights (ndim>=2).
  CLIP_GRAD: 0.5           # was 1.0 — tighter cap to keep optimizer steps from runaway updates.
  AUTO_RESUME: true
  AMP_DTYPE: bfloat16
  ACCUMULATION_STEPS: 1
  SAVE_EVERY_ITERS: 2000   # mid-epoch atomic ckpt every ~12 min; caps SIGKILL loss.
  EARLY_STOP_PATIENCE: 8   # 5->8: ep0-4 ran NORM_WEIGHT=0 (config bug), ep5+ =2.0, so the
                           # baseline was reset at ep8 (best_val cleared); give the new-regime
                           # run room before early-stopping. See ckpt_epoch_7 reset 2026-06-06.

EVAL:
  EVERY_N_EPOCHS: 1        # was 5 — catch any collapse mode within the first epoch boundary.

AMP_ENABLE: true
SAVE_FREQ: 1
PRINT_FREQ: 5
SEED: 42
