[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efficientsam3"
version = "0.1.0"
description = "EfficientSAM3 research utilities and Stage-1/2 distillation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chengxi Simon Zeng"},
    {name = "Yuxuan Jiang"},
    {name = "Aaron Zhang"},
]
keywords = ["computer vision", "segmentation", "distillation", "sam3"]

# Shared base deps
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "tqdm>=4.65",
    "typing_extensions",
    "huggingface_hub>=0.20",
    "requests>=2.31",
    "ftfy>=6.1",
    "regex",
    "iopath>=0.1.10",
    "timm>=1.0",
]

[project.optional-dependencies]
# Dashboard + TensorBoard viewer
# Install: uv pip install -e ".[dashboard]"
dashboard = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "tensorboard>=2.14",
    "tensorflow>=2.14",
]

# Stage 2 training
# NOTE: torch must be installed separately with the CUDA index:
#   uv pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128
# NOTE: sam-2 must be installed from source:
#   uv pip install -e /path/to/sam2
train = [
    "decord>=0.6",
    "opencv-python-headless>=4.8",
    "einops>=0.7",
    "scipy>=1.10",
    "accelerate>=0.26",
    "transformers>=4.38",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "addict>=2.4",
    "tensorboard>=2.14",
]

# Stage 1 extras
stage1 = [
    "torch>=2.7.0",
    "torchvision>=0.18.0",
    "decord>=0.6.0",
    "mmengine>=0.10.4",
    "pycocotools>=2.0.7",
    "yacs>=0.1.8",
    "opencv-python>=4.9.0.80",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "einops>=0.7.0",
    "hydra-core>=1.3.2",
    "submitit>=1.5.1",
    "fvcore>=0.1.5.post20221221",
    "fairscale>=0.4.13",
    "mmcv>=2.1.0",
    # PyPI name: segment-anything, import name: segment_anything
    "segment-anything",
]

sam1 = ["segment-anything"]

dev = [
    "pytest",
    "pytest-cov",
    "black==24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/SimonZeng7108/efficientsam3"

[tool.setuptools.packages.find]
include = ["stage1*", "stage2*", "sam3*", "dashboard*"]
